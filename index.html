<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0f0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Bit-Zombie</title>
    <link rel="stylesheet" href="/packages/client/src/ui/interface.css" />
    <meta name="description" content="Protótipo de sobrevivência zumbi cooperativo top-down 2D com Phaser 3, Colyseus e simulação determinística compartilhada." />
    <meta property="og:title" content="Zombie Survival Coop" />
    <meta property="og:description" content="Protótipo de sobrevivência zumbi cooperativo top-down 2D com Phaser 3, Colyseus e simulação determinística compartilhada." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0c0f0d;
        color: #e6ece8;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      #fullscreen-toggle, .fullscreen-status {
        position: fixed;
        right: calc(8px + var(--safe-right));
        z-index: 70;
        border: 1px solid #577963;
        border-radius: 8px;
        background: #17261d;
        color: #e4f1e7;
        padding: 6px 10px;
        font: 600 12px system-ui, sans-serif;
      }
      #fullscreen-toggle {
        bottom: calc(8px + var(--safe-bottom));
        min-height: 36px;
        cursor: pointer;
      }
      .fullscreen-status {
        bottom: calc(64px + var(--safe-bottom));
        max-width: min(280px, 85vw);
      }
      @media (pointer: coarse) {
        .mobile-quick-items:not([hidden]) {
          padding-right: 120px;
        }
      }
      .team-status {
        color: #b8d6c1;
        font: 600 11px system-ui, sans-serif;
        overflow-wrap: anywhere;
      }
      @media (pointer: coarse) {
        button, input, select, summary {
          min-height: 48px !important;
          min-width: 48px !important;
        }
        summary { display: list-item; align-content: center; }
        .mobile-quick-items:not([hidden]) {
          position: fixed;
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 4px;
          left: calc(8px + var(--safe-left));
          right: calc(8px + var(--safe-right));
          bottom: calc(8px + var(--safe-bottom));
          z-index: 30;
          pointer-events: none;
        }
        .mobile-quick-items > button {
          position: static !important;
          pointer-events: auto;
          max-width: 100%;
        }
        .mobile-graphics {
          background: #203127;
          color: #e6ece8;
          border: 1px solid #577963;
          border-radius: 6px;
        }
        [data-testid="hud-hint-bar"] { display: none !important; }
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/packages/client/src/main.ts"></script>
  </body>
</html>
